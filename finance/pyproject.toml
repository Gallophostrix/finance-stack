[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-etl"
version = "0.1.0"
description = "Finance ETL — fetch, derive, compute returns"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.scripts]
finance-sync-dims       = "etl.scripts.sync_dims:main"
finance-fetch-prices    = "etl.scripts.fetch_prices:main"
finance-fetch-bitcoin   = "etl.scripts.fetch_bitcoin:main"
finance-fetch-cardano   = "etl.scripts.fetch_cardano:main"
finance-fetch-avalanche = "etl.scripts.fetch_avalanche:main"
finance-fetch-xrpl      = "etl.scripts.fetch_xrpl:main"
finance-import-balances = "etl.scripts.import_balances:main"
finance-import-flows    = "etl.scripts.import_flows:main"
finance-derive          = "etl.scripts.derive:main"
finance-returns         = "etl.scripts.compute_returns:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*"]

[tool.ruff]
line-length = 120
target-version = "py312"
