name: CI (monorepo)

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Lint Python (ETL)
  python:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('finance/requirements/*.txt') }}
      - name: Install deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/api.txt -r requirements/calc.txt
          pip install ruff
      - name: Ruff
        run: ruff check etl

  # Lint YAML (grafana, loki, prom, assets, compose, etc.)
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yamllint
      - name: Yamllint
        run: |
          yamllint -s \
            .github/workflows \
            compose.yml \
            grafana \
            loki \
            prometheus \
            finance/assets || true

  # Lint Dockerfiles
  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
          -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
      - name: Hadolint
        run: |
          hadolint finance/etl/Dockerfile || true

  # Smoke test SQL : applique les fichiers d’init sur un Postgres éphémère
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U finance -d finance"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for DB
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U finance -d finance && break
            sleep 1
          done
      - name: Apply init SQL
        env:
          PGPASSWORD: finance
        run: |
          psql -h 127.0.0.1 -U finance -d finance -v ON_ERROR_STOP=1 -f finance/sql/init_core.sql
          psql -h 127.0.0.1 -U finance -d finance -v ON_ERROR_STOP=1 -f finance/sql/init_market.sql
          psql -h 127.0.0.1 -U finance -d finance -v ON_ERROR_STOP=1 -f finance/sql/init_derived.sql
