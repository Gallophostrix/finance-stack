name: Monitoring CI

on:
    pull_request:
    push:
        branches: [master]

jobs:
    # ── Lint + test Python (ETL) ────────────────────────────────────────────────
    python:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: finance
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: pip-${{ runner.os }}-${{ hashFiles('finance/requirements/*.txt') }}
            - name: Install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements/base.txt -r requirements/dev.txt
                  pip install ruff
            - name: Ruff
              run: ruff check etl

    # ── Lint YAML ───────────────────────────────────────────────────────────────
    yaml:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - run: pip install yamllint
            - name: Yamllint
              run: |
                  yamllint -s \
                    .github/workflows \
                    infra/compose.yml \
                    finance/compose.yml \
                    infra/grafana \
                    infra/loki \
                    infra/prometheus \

    # ── Smoke test SQL ──────────────────────────────────────────────────────────
    sql:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: finance
                    POSTGRES_USER: finance
                    POSTGRES_PASSWORD: finance
                ports: ["5432:5432"]
                options: >-
                    --health-cmd="pg_isready -U finance -d finance"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10
        steps:
            - uses: actions/checkout@v4
            - name: Wait for DB
              run: |
                  for i in {1..30}; do
                    pg_isready -h 127.0.0.1 -p 5432 -U finance -d finance &&
                    break
                    sleep 1
                  done
            - name: Apply init SQL
              env:
                  PGPASSWORD: finance
              run: |
                  psql -h 127.0.0.1 -U finance -d finance -v ON_ERROR_STOP=1 \
                    -f finance/sql/init_core.sql
                  psql -h 127.0.0.1 -U finance -d finance -v ON_ERROR_STOP=1 \
                    -f finance/sql/init_market.sql
                  psql -h 127.0.0.1 -U finance -d finance -v ON_ERROR_STOP=1 \
                    -f finance/sql/init_derived.sql
