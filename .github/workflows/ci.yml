name: Monitoring CI

on:
  pull_request:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Lint Python (ETL) ──────────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff
        run: ruff check etl

  # ── Lint YAML ──────────────────────────────────────────────────────────────
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yamllint

      - name: Yamllint
        run: |
          yamllint -s \
            .github/workflows \
            infra/compose.yml \
            finance/compose.yml \
            infra/grafana \
            infra/loki \
            infra/prometheus \

  # ── Nix build ──────────────────────────────────────────────────────────────
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Build finance-etl
        run: nix build .#finance-etl --no-link

      - name: Check flake
        run: nix flake check
