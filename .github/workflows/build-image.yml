name: build-image

on:
  push:
    branches: [master]
    paths:
      - finance/**
      - .github/workflows/build-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: v
        shell: bash
        run: |
          version="$(grep -oP '__version__\s*=\s*"\K[^"]+' finance/etl/__init__.py)"
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        shell: bash
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.v.outputs.version }}"
          docker build \
            --build-arg VERSION="$VERSION" \
            -t ghcr.io/$OWNER/finance-etl:latest \
            -t ghcr.io/$OWNER/finance-etl:$VERSION \
            -f finance/etl/Dockerfile finance
          docker push ghcr.io/$OWNER/finance-etl:latest
          docker push ghcr.io/$OWNER/finance-etl:$VERSION
