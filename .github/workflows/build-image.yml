name: build-image
on:
  push:
    branches: [master]
    paths:
      - "finance/**"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: v
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          m=re.search(r'__version__\s*=\s*"([^"]+)"', Path('finance/etl/__init__.py').read_text())
          print(f"version={m.group(1)}")
          PY
          | tee /tmp/version.txt
          echo "::set-output name=version::$(cut -d= -f2 /tmp/version.txt)"
        shell: bash

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          docker build \
            --build-arg VERSION="$VERSION" \
            -t ghcr.io/${{ github.repository_owner }}/finance-etl:latest \
            -t ghcr.io/${{ github.repository_owner }}/finance-etl:${VERSION} \
            -f finance/etl/Dockerfile finance
          docker push ghcr.io/${{ github.repository_owner }}/finance-etl:latest
          docker push ghcr.io/${{ github.repository_owner }}/finance-etl:${VERSION}
