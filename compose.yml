services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100" # lo access
    volumes:
      - ./loki:/etc/loki
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/config.yml
      - -log.format=json
    networks:
      monitoring:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      monitoring:
    ports:
      - "127.0.0.1:9090:9090" # lo access
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    pid: "host"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/log/journal:/run/log/journal:ro
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - /:/rootfs:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345" # lo access
    networks:
      monitoring:

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000" # lo access
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SERVER_ROOT_URL=https://grafana.lan
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_adminpwd
      - GF_LOG_MODE=console
      - GF_LOG_CONSOLE_FORMAT=json
      - TZ=Europe/Paris
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Europe/Paris
      - GF_PLUGIN_GRAFANA_IMAGE_RENDERER_RENDERING_TIMEZONE=Europe/Paris
      - FINANCE_PG_HOST=finance-db
      - FINANCE_PG_DB=finance
      - FINANCE_PG_USER=finance
      - FINANCE_PG_PASSWORD_FILE=/run/secrets/finance_pgpwd
    secrets:
      - grafana_adminpwd
      - finance_pgpwd
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      monitoring:
      reverse_proxy:

  finance-db:
    image: postgres
    container_name: finance-db
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD_FILE: /run/secrets/finance_pgpwd
    volumes:
      - finance-db:/var/lib/postgresql/data
      - ./finance/sql:/docker-entrypoint-initdb.d:ro
    secrets:
      - finance_pgpwd
    networks:
      monitoring:

  finance-etl-calc:
    image: python:3.11-slim
    container_name: finance-etl-mwr
    depends_on: [finance-db]
    working_dir: /app
    environment:
      TZ: Europe/Paris
      DB_HOST: finance-db
      DB_PORT: 5432
      DB_NAME: finance
      DB_USER: finance
      DB_PASS_FILE: /run/secrets/finance_pgpwd
    volumes:
      - ./finance/scripts:/app
    secrets:
      - finance_pgpwd
    entrypoint: >
      bash -lc '
      set -euo pipefail;
      pip install -r mwr/requirements_mwr.txt;
      export DB_PASS="$(cat "$${DB_PASS_FILE}")";
      python mwr/etl_mwr.py
      '
    networks:
      monitoring:

  finance-etl-api:
    image: ghcr.io/gallophostrix/finance-stack/finance-etl:latest
    container_name: finance-etl-api
    depends_on: [finance-db]
    working_dir: /app
    environment:
      TZ: Europe/Paris
      DB_PASS_FILE: /run/secrets/finance_pgpwd
    volumes:
      - ./finance/assets:/app/assets:ro
      - ./finance/requirements:/app/requirements:ro
    secrets:
      - finance_pgpwd
    entrypoint: >
      bash -lc '
      set -euo pipefail;
      export DB_PASS="$(cat "$${DB_PASS_FILE}")";
      export PG_DSN="postgresql://finance:$${DB_PASS}@finance-db:5432/finance";
      python -m etl.api.balances /app/assets --dsn "$${PG_DSN}";
      '
    networks:
      monitoring:
      #python -m etl.api.flows /app/assets --start 2025-01-01 --dsn "$${PG_DSN}";

networks:
  monitoring:
  reverse_proxy:
    external: true

volumes:
  grafana-storage:
  loki-data:
  alloy-data:
  prometheus-data:
  finance-db:
secrets:
  grafana_adminpwd:
    file: ./grafana_pwd.txt
  finance_pgpwd:
    file: ./postgres_pwd.txt
