services:
    loki:
        image: grafana/loki:latest
        container_name: loki
        ports:
            - "127.0.0.1:3100:3100"
        volumes:
            - ./loki:/etc/loki
            - loki-data:/loki
        command:
            - -config.file=/etc/loki/config.yml
            - -log.format=json
        networks:
            - monitoring
            - reverse_proxy
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        networks:
            - monitoring
            - reverse_proxy
        ports:
            - "127.0.0.1:9090:9090"
        restart: unless-stopped

    alloy:
        image: grafana/alloy:latest
        container_name: alloy
        pid: "host"
        volumes:
            - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
            - alloy-data:/var/lib/alloy/data
            - /var/log:/var/log
            - /var/lib/docker:/var/lib/docker:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /run/log/journal:/run/log/journal:ro
            - /run/udev:/run/udev:ro
            - /sys:/sys:ro
            - /sys/fs/cgroup:/sys/fs/cgroup:ro
            - /proc:/host/proc:ro
            - /:/rootfs:ro
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
        ports:
            - "127.0.0.1:12345:12345"
        networks:
            - monitoring
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "127.0.0.1:3000:3000"
        environment:
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_SERVER_ROOT_URL=https://grafana.lan
            - GF_AUTH_ANONYMOUS_ENABLED=false
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_adminpwd
            - GF_LOG_MODE=console
            - GF_LOG_CONSOLE_FORMAT=json
            - TZ=Europe/Paris
            - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Europe/Paris
            - GF_ANALYTICS_REPORTING_ENABLED=false
            - GF_ANALYTICS_CHECK_FOR_UPDATES=false
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - FINANCE_PG_HOST=finance-db
            - FINANCE_PG_DB=finance
            - FINANCE_PG_USER=finance
            - FINANCE_PG_PASSWORD_FILE=/run/secrets/finance_pgpwd
        volumes:
            - grafana-storage:/var/lib/grafana
            - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
            - ../secrets/grafana_pwd.txt:/run/secrets/grafana_adminpwd:ro
            - ../secrets/postgres_pwd.txt:/run/secrets/finance_pgpwd:ro
        networks:
            - monitoring
            - reverse_proxy
        restart: unless-stopped

networks:
    monitoring:
        external: true
    reverse_proxy:
        external: true

volumes:
    grafana-storage:
    loki-data:
    alloy-data:
    prometheus-data:
